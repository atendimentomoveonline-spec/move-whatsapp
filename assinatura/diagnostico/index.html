<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico Fiscal — Move Online</title>
<link rel="icon" href="logo_move.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--navy:#003459;--navy2:#00243f;--green:#2BCA92;--green2:#1fa877;--ink:#0f1e2e;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--red:#dc2626;--redbg:#fef2f2}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px 40px}
  .top{background:var(--navy);color:#fff;margin:0 -16px;padding:26px 24px 56px;border-radius:0 0 26px 26px}
  .top img{height:30px;display:block}
  .top h1{margin:22px 0 4px;font-size:26px;line-height:1.2}
  .top h1 span{color:var(--green)}
  .top p{margin:0;opacity:.85;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:-32px}
  @media(min-width:880px){.grid{grid-template-columns:340px 1fr}}
  .card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 20px rgba(0,52,89,.08)}
  .sec{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--navy);text-transform:uppercase;margin:0 0 4px}
  label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
  input,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;outline:none;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus{border-color:var(--green)}
  .money{position:relative}.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:15px}
  .money input{padding-left:42px}
  .money input.big{font-size:22px;font-weight:800;color:var(--navy)}
  .hint{font-size:12px;color:#94a3b8;margin-top:5px;line-height:1.4}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;margin-top:8px}
  .badge.r{background:#e8faf3;color:var(--green2)}
  .badge.n{background:#eef2f7;color:var(--navy)}
  /* resultado */
  .cmp{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:600px){.cmp{grid-template-columns:1fr 1fr}}
  .opt{border:1.5px solid var(--line);border-radius:16px;padding:18px}
  .opt h3{margin:0;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);font-weight:800}
  .opt.b{border-color:var(--navy)}
  .opt.b h3{color:var(--navy)}
  .opt .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .opt .ln span{color:var(--mut)}
  .opt .ln small{color:#94a3b8;font-size:12px}
  .opt .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
  .opt .tot span{font-size:13px;font-weight:700;color:var(--mut)}
  .opt .tot b{font-size:30px;letter-spacing:-.5px;color:var(--navy)}
  .opt .pc{text-align:right;font-size:13px;color:var(--mut)}
  .hero{margin-top:16px;border-radius:18px;padding:22px;background:var(--navy);color:#fff;display:grid;grid-template-columns:1fr;gap:14px;align-items:center}
  @media(min-width:600px){.hero{grid-template-columns:1.3fr 1fr}}
  .hero .lbl{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.75}
  .hero .val{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:4px}
  .hero .val.up{color:#ff8a8a}.hero .val.down{color:var(--green)}
  .hero .sub{font-size:14px;opacity:.85;margin-top:4px}
  .hero .pill{background:rgba(255,255,255,.1);border-radius:14px;padding:14px;text-align:center}
  .hero .pill b{display:block;font-size:34px;font-weight:800}
  .hero .pill span{font-size:12px;opacity:.8}
  .bars{margin-top:18px}
  .bar{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;font-size:14px;margin:10px 0}
  .bar .trk{height:16px;background:var(--bg);border-radius:8px;overflow:hidden}
  .bar .fil{height:100%;border-radius:8px;transition:width .35s}
  .bar b{text-align:right}
  .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .btn{flex:1;min-width:160px;padding:15px;border:none;border-radius:12px;background:var(--green);color:var(--navy);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--green2);color:#fff}
  .btn.o{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .btn.o:hover{background:var(--navy);color:#fff}
  .empty{text-align:center;color:var(--mut);padding:60px 10px;font-size:15px}
  .note{margin-top:16px}
  .fund{background:#f4f8fb;border-left:4px solid var(--green);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.55}
  .fund .ft{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--navy);margin-bottom:4px}
  .foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .grid{align-items:start}
  @media(min-width:880px){.grid{grid-template-columns:400px 1fr}}
  .q{margin-top:16px}
  .q .t{font-size:14px;font-weight:700;color:var(--navy)}
  .q .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e8faf3;color:var(--green2);font-size:12px;font-weight:800;margin-right:6px}
  .ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .ops button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13.5px;font-family:inherit;color:var(--ink);cursor:pointer}
  .ops button:hover{border-color:var(--green)}
  .ops button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .q select,.q .money{margin-top:8px}
  .chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--mut);cursor:pointer}
  .chk input{width:18px;height:18px;accent-color:var(--green)}
  .rs{margin-top:22px}.rs:first-child{margin-top:0}
  .rs h2{margin:0 0 10px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--navy);display:flex;gap:8px;align-items:center}
  .rs h2 span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px}
  .perfil{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .perfil div{background:#f4f8fb;border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mut)}
  .perfil b{display:block;color:var(--navy);font-size:14px;margin-top:2px}
  .pt{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .pt .c{width:20px;height:20px;border-radius:50%;margin-top:2px}.pt .c.r{background:#ef4444}.pt .c.y{background:#f5b301}.pt .c.g{background:var(--green)}
  .pt b{color:var(--navy);font-size:14px}.pt .d{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.5}
  .pt .v{font-size:12.5px;font-weight:800;color:var(--navy);margin-top:4px}.pt a{color:var(--green2);font-weight:700;font-size:12.5px}
  ol.plano{margin:0;padding-left:20px;line-height:1.6;font-size:14px}ol.plano li{margin:6px 0}ol.plano small{display:block;color:var(--mut);font-size:12.5px}
  .score{display:flex;align-items:baseline;gap:6px}.score b{font-size:44px;letter-spacing:-1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="logo_move_navy.png" alt="Move Online">
    <h1>Diagnóstico <span>fiscal</span></h1>
    <p>Responda em 2 minutos e receba o relatório: seu enquadramento, quanto paga hoje, quanto poderia pagar e o que fazer.</p>
  </div>

  <div class="grid">
    <div class="card">
      <div class="sec">Perguntas</div>
      <div id="qs"></div>
    </div>
    <div class="card">
      <div class="empty" id="empty">Responda as perguntas para gerar o relatório.<br><span id="falta"></span></div>
      <div id="res" style="display:none"></div>
    </div>
  </div>
  <div class="foot">Diagnóstico gratuito e estimado. Não substitui a análise do contador.<br>Move Online Contabilidade Médica</div>
</div>
<div class="toast" id="toast"></div>

<script>
const WHATS_MOVE='5511978036539'; // (11) 97803-6539
const SAL_MIN=1621.00, TETO_INSS=8475.55, FR=.28;
const A3=[[180000,.06,0],[360000,.112,9360],[720000,.135,17640],[1800000,.16,35640],[3600000,.21,125640],[4800000,.33,648000]];
const A5=[[180000,.155,0],[360000,.18,4500],[720000,.195,9900],[1800000,.205,17100],[3600000,.23,62100],[4800000,.305,540000]];
const IR_TAB=[[2428.80,0,0],[2826.65,.075,182.16],[3751.05,.15,394.16],[4664.68,.225,675.49],[Infinity,.275,908.73]];
const S=.6,P=.3,N=0;
// [atividade, usa Fator R, redução na reforma, CNAE (só quando a classificação é clara)]
const ATV=[['Médico',1,S,'8630-5/03 (consultas) · 8630-5/01 com procedimentos'],['Dentista',1,S,'8630-5/04'],['Psicólogo',1,S,'8650-0/03'],['Fisioterapeuta',1,S,'8650-0/04'],
 ['Fonoaudiólogo',1,S,'8650-0/06'],['Terapeuta ocupacional',1,S,'8650-0/05'],['Nutricionista',1,S,'8650-0/02'],['Professor de pilates (fisioterapeuta)',1,S,'8650-0/04'],
 ['Professor de pilates (educador físico)',0,P,''],['Personal trainer',0,P,''],['Educador físico',0,P,''],['Musicoterapeuta',0,N,''],['Acompanhante / atendente terapêutico',0,N,''],
 ['Psicopedagogo',0,N,''],['Neuropsicopedagogo',0,N,''],['Aplicador ABA',0,N,''],['Psicanalista',0,N,''],['Psicomotricista',0,N,''],['Arteterapeuta',0,N,''],['Acupunturista',0,N,''],
 ['Massoterapeuta',0,N,''],['Terapeuta integrativo / holístico',0,N,''],['Instrutor de yoga',0,N,''],['Doula',0,N,'']].sort((a,b)=>a[0].localeCompare(b[0],'pt-BR'));
const RED={[S]:'60% (saúde, LC 214, art. 130)',[P]:'30% (profissão regulamentada, LC 214, art. 127)',[N]:'sem redução'};
// perguntas: [chave, texto, tipo, opções, condição]
const Q=[
 ['cnpj','Você já tem empresa (CNPJ)?','ops',[['s','Sim'],['n','Ainda não']]],
 ['atv','Qual a sua atividade?','sel'],
 ['reg','Qual o regime da empresa?','ops',[['SN','Simples Nacional'],['LP','Lucro Presumido'],['NS','Não sei']],A=>A.cnpj==='s'],
 ['fat','Quanto você fatura por mês, aproximadamente?','ops',[['12000','Até R$ 20 mil'],['35000','R$ 20 a 50 mil'],['75000','R$ 50 a 100 mil'],['200000','R$ 100 a 300 mil'],['350000','Acima de R$ 300 mil']]],
 ['pro','Quanto você tira de pró-labore?','ops',[['min','Cerca de 1 salário mínimo'],['meio','Mais que isso, mas menos de 28% do faturamento'],['fr','28% do faturamento ou mais'],['zero','Não tiro pró-labore'],['ns','Não sei']],A=>A.cnpj==='s'],
 ['rec','Como você recebe hoje?','ops',[['pf','De pacientes (pessoa física)'],['pj','De hospitais e clínicas (RPA)'],['amb','Dos dois']],A=>A.cnpj==='n'],
 ['func','Tem funcionários registrados?','ops',[['s','Sim'],['n','Não']]],
 ['loc','Onde você atende?','ops',[['prop','Consultório ou clínica própria'],['terc','Hospitais e clínicas de terceiros'],['amb','Nos dois']]],
 ['proc','Faz procedimentos (cirurgias, exames, day clinic)?','ops',[['s','Sim'],['n','Não, só consultas']]],
 ['soc','Como é (ou seria) a sociedade?','ops',[['so','Só eu'],['mesma','Sócios da mesma profissão'],['mix','Sócios de profissões diferentes ou investidores']]],
 ['cli','De quem você mais recebe?','ops',[['pf','Pacientes pessoa física'],['pj','Hospitais, clínicas e convênios'],['ex','Clientes do exterior'],['mix','Um pouco de cada']]],
 ['lucro','Retira mais de R$ 50 mil de lucros em algum mês?','ops',[['s','Sim'],['n','Não']],A=>A.cnpj==='s'],
 ['rev','Quando seus impostos foram revisados pela última vez?','ops',[['nunca','Nunca'],['velho','Há mais de um ano'],['ok','No último ano']],A=>A.cnpj==='s'],
];
const $=id=>document.getElementById(id);
const num=s=>{s=(s||'').toString().trim();if(!s)return 0;s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n};
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const pct=v=>(v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2})+'%';
const fmt=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const A={};
const ATVsel=a=>a.atv!==undefined&&a.atv!==''?ATV[+a.atv]:null;

function desenha(){
  let n=0;
  $('qs').innerHTML=Q.map(([k,t,tp,op,cond])=>{if(cond&&!cond(A))return '';n++;
    let c='';
    if(tp==='ops')c=`<div class="ops" data-k="${k}">${op.map(([v,l])=>`<button type="button" data-v="${v}" class="${A[k]===v?'on':''}">${l}</button>`).join('')}</div>`;
    if(tp==='sel')c=`<select data-k="${k}"><option value="">Selecione…</option>${ATV.map((a,i)=>`<option value="${i}" ${String(A[k])===String(i)?'selected':''}>${a[0]}</option>`).join('')}</select>`;
    if(tp==='val')c=`<div class="money"><span>R$</span><input data-k="${k}" class="big" inputmode="decimal" placeholder="20.000,00" value="${A[k]?fmt(A[k]):''}"></div>`;
    if(tp==='pro')c=`<div class="money"><span>R$</span><input data-k="pro" inputmode="decimal" placeholder="0,00" value="${A.pro?fmt(A.pro):''}" ${A.proNS?'disabled':''}></div><label class="chk"><input type="checkbox" data-k="proNS" ${A.proNS?'checked':''}> Não sei / não tiro pró-labore</label>`;
    if(tp==='folha')c=`<div class="money"><span>R$</span><input data-k="folha" inputmode="decimal" placeholder="0,00 (deixe em branco se não tiver)" value="${A.folha?fmt(A.folha):''}"></div>`;
    return `<div class="q"><div class="t"><span class="n">${n}</span>${t}</div>${c}</div>`}).join('');
  $('qs').querySelectorAll('.ops button').forEach(b=>b.onclick=()=>{A[b.parentNode.dataset.k]=b.dataset.v;desenha();render()});
  $('qs').querySelectorAll('select').forEach(s=>s.onchange=()=>{A.atv=s.value;desenha();render()});
  $('qs').querySelectorAll('input.big,input[data-k=pro],input[data-k=folha]').forEach(i=>{i.oninput=()=>{A[i.dataset.k]=num(i.value);render()};i.onblur=()=>{i.value=A[i.dataset.k]?fmt(A[i.dataset.k]):''}});
  const ns=$('qs').querySelector('input[data-k=proNS]');if(ns)ns.onchange=()=>{A.proNS=ns.checked;if(ns.checked)A.pro=0;desenha();render()};
}
function faltam(){return Q.filter(([k,t,tp,op,cond])=>(!cond||cond(A))&&(A[k]===undefined||A[k]==='')).length}

// ── contas ──
function ef(t,rbt){let i=t.findIndex(f=>rbt<=f[0]);if(i<0)i=5;const [,n,d]=t[i];return rbt<=180000?n:(rbt*n-d)/rbt}
function irrf(b,ded){const base=b-Math.max(ded,607.2);if(base<=0)return 0;const [,a,d]=IR_TAB.find(f=>base<=f[0]);const tab=Math.max(0,base*a-d);let red=0;if(b<=5000)red=tab;else if(b<=7350)red=Math.min(tab,Math.max(0,978.62-0.133145*b));return tab-red}
function simples(F,pro,folha,anexo){const das=F*ef(anexo==='III'?A3:A5,F*12),inss=Math.min(pro,TETO_INSS)*.11,ir=pro?irrf(pro,inss):0;
  return {rot:`Simples Nacional · Anexo ${anexo} · pró-labore ${brl(pro)}`,itens:[[`DAS (Anexo ${anexo}, ${pct(das/F)})`,das],['INSS do pró-labore',inss],['IR do pró-labore',ir]],tot:das+inss+ir}}
function presumido(F,pro,equip){const pi=equip?.08:.32,pc=equip?.12:.32,bI=F*pi,irpj=bI*.15+Math.max(0,bI-20000)*.10,csll=F*pc*.09,pis=F*.0365,iss=F*.02,cpp=pro*.20,inss=Math.min(pro,TETO_INSS)*.11,ir=pro?irrf(pro,inss):0;
  return {rot:`Lucro Presumido${equip?' com equiparação hospitalar':''} · pró-labore ${brl(pro)}`,itens:[['IRPJ e CSLL',irpj+csll],['PIS e COFINS',pis],['ISS (2%)',iss],['INSS da empresa (20%)',cpp],['INSS e IR do pró-labore',inss+ir]],tot:irpj+csll+pis+iss+cpp+inss+ir}}
function melhorSimples(F,fr,folha){if(!fr)return simples(F,SAL_MIN,folha,'III');
  const proFR=Math.max(SAL_MIN,Math.ceil(Math.round((F*FR-folha)*10000)/100)/100),a=simples(F,proFR,folha,'III'),b=simples(F,SAL_MIN,folha,'V');return a.tot<=b.tot?a:b}
function pessoaFisica(F,rec){const aliq=rec==='pj'?.11:.20,inss=Math.min(F,TETO_INSS)*aliq,ir=irrf(F,inss);
  return {rot:rec==='pj'?'Pessoa física (RPA)':'Pessoa física (carnê-leão)',itens:[[`INSS (${rec==='pj'?'11% retido':'20% no carnê'})`,inss],['Imposto de renda',ir]],tot:inss+ir}}

function relatorio(){
  const a=ATVsel(A),F=+A.fat,fr=a[1],folha=0;
  const pro={min:SAL_MIN,meio:Math.max(SAL_MIN,(SAL_MIN+F*FR)/2),fr:Math.max(SAL_MIN,F*FR),zero:0,ns:SAL_MIN}[A.pro]||0;
  let hoje,rec,obs='';
  if(A.cnpj==='n'){hoje=pessoaFisica(F,A.rec==='amb'?'pf':A.rec);rec=melhorSimples(F,fr,folha);rec.rot='Com CNPJ no '+rec.rot;obs='Cálculo com o valor médio da faixa de faturamento.'}
  else if(A.reg==='LP'){hoje=presumido(F,pro||SAL_MIN,false);const op=[presumido(F,SAL_MIN,false)];if(A.proc==='s')op.push(presumido(F,SAL_MIN,true));if(F*12<=4800000)op.push(melhorSimples(F,fr,folha));rec=op.sort((x,y)=>x.tot-y.tot)[0]}
  else{const anexo=!fr?'III':(A.pro==='fr'?'III':'V');hoje=simples(F,pro,folha,anexo);rec=melhorSimples(F,fr,folha);
    obs='Cálculo com o valor médio da faixa de faturamento'+(A.pro==='ns'?' e pró-labore de 1 salário mínimo':'')+'.'+(A.reg==='NS'?' Como você não sabe o regime, consideramos o Simples Nacional, que é o mais comum.':'');
    if(rec.tot>hoje.tot){rec=hoje}}
  const eco=Math.max(0,hoje.tot-rec.tot);
  // pontos de atenção
  const Pt=[];
  if(A.cnpj==='n')Pt.push(['r','Você paga como pessoa física',`Como pessoa física, INSS e imposto de renda levam ${pct(hoje.tot/F)} do que você recebe. Com um CNPJ no Simples${fr?' e Fator R':''}, a carga cai para ${pct(rec.tot/F)}.`,eco*12,['Veja quanto custa abrir','../abertura/'],'Abrir um CNPJ no Simples Nacional'+(fr?' com pró-labore de 28% (Fator R)':'')]);
  if(A.cnpj==='s'&&A.reg!=='LP'&&fr&&hoje.rot.includes('Anexo V')&&rec.rot.includes('Anexo III'))Pt.push(['r','Fator R: seu DAS está no Anexo V',`Com pró-labore e salários abaixo de 28% do faturamento, a atividade fica no Anexo V. Com pró-labore de ${brl(Math.max(SAL_MIN,F*FR-folha))}, ela vai para o Anexo III.`,eco*12,['Simule o Fator R','../fatorr/'],'Ajustar o pró-labore para atingir o Fator R de 28%']);
  if(A.cnpj==='s'&&A.reg==='NS')Pt.push(['r','Você não sabe o regime do seu CNPJ','Sem saber o regime, não dá para saber se você paga o imposto certo.',0,null,'Confirmar o regime e o anexo do seu CNPJ']);
  if(A.cnpj==='s'&&A.reg==='LP'&&A.proc==='s')Pt.push(['r','Equiparação hospitalar',`Com procedimentos, a clínica pode calcular IRPJ sobre 8% e CSLL sobre 12% do faturamento, em vez de 32%. Exige estrutura e licença sanitária adequadas.`,0,null,'Avaliar a equiparação hospitalar']);
  if(A.cnpj==='s'&&A.reg==='LP'&&rec.rot.startsWith('Simples'))Pt.push(['y','O Simples pode ser mais barato','Com esse faturamento, o Simples Nacional sai mais barato que o Presumido.',0,['Compare Simples × Presumido','../presumido/'],'Estudar a troca para o Simples Nacional (só em janeiro)']);
